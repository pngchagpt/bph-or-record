<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<title>Operating Room Record – BPH Maramag</title>
<style>
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#000;background:#eef1f5}
  .bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;padding:10px 12px;background:#1f3b5c;box-shadow:0 2px 6px rgba(0,0,0,.25)}
  .bar button{flex:1;min-height:52px;font-size:18px;font-weight:bold;border:0;border-radius:10px;cursor:pointer}
  #btnPrint{background:#2e9d4f;color:#fff}
  #btnClear{background:#fff;color:#b3261e}
  .note{max-width:820px;margin:10px auto 0;padding:0 14px;font-size:14px;color:#445}
  .sheet{max-width:820px;margin:10px auto 40px;background:#fff;padding:18px 16px 28px;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
  .hdr{text-align:center;margin-bottom:14px}
  .hdr .h1{font-weight:bold;font-size:17px}
  .hdr .h2{font-size:14px}
  .hdr .h3{font-weight:bold;font-size:15px;margin-top:10px;letter-spacing:.3px}
  .row{display:flex;flex-wrap:wrap;gap:6px 18px;margin:0 0 10px}
  .f{display:flex;flex-direction:column;flex:1 1 100%;min-width:0}
  .f.s{flex:1 1 40%}
  label,.lbl{font-size:15px;font-weight:bold;margin-bottom:4px}
  input[type=text]{width:100%;font:inherit;font-size:18px;padding:10px;min-height:48px;border:1px solid #9aa4b1;border-radius:8px;background:#fff;color:#000}
  textarea{width:100%;font:inherit;font-size:18px;padding:10px;border:1px solid #9aa4b1;border-radius:8px;resize:vertical;min-height:110px;overflow:hidden;color:#000}
  textarea.big{min-height:170px}
  input:focus,textarea:focus{outline:3px solid #7fb2ff;border-color:#2b6cd6}
  .blk{margin:4px 0 14px}
  .mirror{display:none}
  .choice{display:flex;gap:10px;flex-wrap:wrap}
  .choice label{display:flex;align-items:center;gap:8px;font-weight:normal;font-size:18px;min-height:48px;padding:0 16px;border:1px solid #9aa4b1;border-radius:8px;cursor:pointer}
  .choice input{width:24px;height:24px}
  .tick{display:none}
  .sig{margin-top:22px;display:flex;justify-content:flex-end}
  .sig .inner{width:100%;max-width:380px}
  .sig .cap{font-size:13px;text-align:center;margin-top:4px}
  @media (min-width:700px){
    .f.m{flex:1 1 45%}
    .f.xs{flex:1 1 20%}
  }

  /* ---------- PRINT: mimic the paper form, always ONE page ----------
     The same rules are applied (a) for real printing inside #orwrap and
     (b) on screen inside the hidden #ormeasure copy, which JS uses to find
     how much to shrink long text so the sheet fits on a single page. */
  .spacer{display:none}
  #ormeasure{position:absolute;left:-30000px;top:0;width:7.0in;visibility:hidden;pointer-events:none;overflow:hidden;height:0}
  #ormeasure .sheet{max-height:none!important;overflow:visible!important}
  /* Phones may ignore these margins and add ~0.5in + header/footer lines;
     the sheet is therefore capped at 7.0in x 9.0in, which fits either way. */
  @page{size:letter;margin:0.4in}
  @media print{
    html,body{margin:0!important;padding:0!important;border:0!important;background:#fff!important;height:auto!important;min-height:0!important;max-height:none!important;overflow:visible!important}
    /* print ONLY the sheet: hide toolbar, note, measuring copy, scripts, everything else */
    body > *:not(#orwrap), .bar, .note, #ormeasure, script, style{display:none!important}
    #orwrap textarea, #orwrap .choice{display:none!important}
    #orwrap{display:block!important;margin:0!important;padding:0!important;height:auto!important;page-break-inside:avoid;break-inside:avoid;page-break-after:avoid;break-after:avoid}
    /* last-resort guard: never spill onto a 2nd page */
    /* hard cap: one fixed-height sheet, nothing can flow past it */
    #orwrap .sheet{height:9.0in!important;max-height:9.0in!important;overflow:hidden!important;position:relative;page-break-before:avoid;break-before:avoid;page-break-inside:avoid;break-inside:avoid;page-break-after:avoid;break-after:avoid}
  #orwrap{--k:1;--t:1;--lh:1.35;--cols:1;--mh:1}
  #orwrap .sheet{width:7.0in;max-width:none;margin:0 auto;padding:0;box-shadow:none;border-radius:0;background:#fff;font-size:calc(10.5pt*var(--k))}
  #orwrap .hdr{margin-bottom:calc(10pt*var(--k))}
  #orwrap .hdr .h1{font-size:calc(11.5pt*var(--k))}
  #orwrap .hdr .h2{font-size:calc(9.5pt*var(--k))}
  #orwrap .hdr .h3{font-size:calc(9.5pt*var(--k));margin-top:calc(8pt*var(--k))}
  #orwrap .row{flex-wrap:nowrap;gap:0 calc(12pt*var(--k));margin:0 0 calc(3pt*var(--k))}
  #orwrap .f{flex-direction:row;align-items:flex-end;flex:1 1 auto}
  #orwrap label, #orwrap .lbl{font-size:calc(10pt*var(--k));font-weight:normal;margin:0 calc(6pt*var(--k)) 0 0;white-space:nowrap}
  #orwrap input[type=text]{flex:1;min-width:0;min-height:0;height:calc(15pt*var(--k));padding:0 2pt;font-size:calc(10.5pt*var(--k));border:0;border-bottom:1px solid #000;border-radius:0;background:transparent;outline:0}
  #orwrap input::placeholder{color:transparent}
  #orwrap textarea{display:none}
  #orwrap .mirror{display:block;white-space:pre-wrap;overflow-wrap:anywhere;word-wrap:break-word;font-size:calc(10.5pt*var(--k)*var(--t));line-height:var(--lh);padding:calc(3pt*var(--k)) 0 0 0}
  #orwrap .mirror.long{column-count:var(--cols);column-gap:calc(14pt*var(--k));column-rule:1px solid #bbb}
  #orwrap .blk{margin:0 0 calc(6pt*var(--k))}
  #orwrap .r2{margin-bottom:calc(10pt*var(--k))!important}
  #orwrap .blk .lbl{display:block;margin:0}
  #orwrap .m_pre, #orwrap .m_post{min-height:calc(1.25in*var(--k)*var(--mh))}
  #orwrap .m_title{min-height:calc(0.75in*var(--k)*var(--mh))}
  #orwrap .m_find{min-height:calc(2.1in*var(--k)*var(--mh))}
  #orwrap .r1 .name{flex:4.2} #orwrap .r1 .age{flex:1.3} #orwrap .r1 .sex{flex:1.4} #orwrap .r1 .cs{flex:1.3}
  #orwrap .r2 .ward{flex:2.4} #orwrap .r2 .bed{flex:2.2} #orwrap .r2 .hosp{flex:2.4}
  #orwrap .grid2{display:flex;gap:0 calc(22pt*var(--k))}
  #orwrap .grid2 .col{flex:1;display:flex;flex-direction:column;min-width:0}
  #orwrap .grid2 .row{margin:0 0 calc(7pt*var(--k))}
  #orwrap .grid2 label{min-width:0}
  #orwrap .spacer{display:block;height:calc(15pt*var(--k));margin:0 0 calc(7pt*var(--k))}
  #orwrap .titlerow{display:flex;align-items:flex-end;gap:0 calc(24pt*var(--k))}
  #orwrap .titlerow .lbl{width:auto}
  #orwrap .titlerow .rvs{flex:0 0 calc(2.4in*var(--k))}
  #orwrap .choice{display:none}
  #orwrap .tick{display:inline-block;width:calc(0.9in*var(--k));border-bottom:1px solid #000;height:calc(13pt*var(--k));text-align:center;font-weight:bold;margin:0 calc(4pt*var(--k)) 0 0}
  #orwrap .tissue{display:flex;align-items:flex-end;gap:0 calc(6pt*var(--k));margin:calc(4pt*var(--k)) 0 calc(8pt*var(--k))}
  #orwrap .tissue .opt{white-space:nowrap;margin-right:calc(10pt*var(--k))}
  #orwrap .tissue .spec{flex:1}
  #orwrap .sig{margin-top:calc(10pt*var(--k))}
  #orwrap .sig .inner{width:calc(3.3in*var(--k));max-width:none;display:flex;flex-wrap:wrap;align-items:flex-end}
  #orwrap .sig .inner label{margin-right:calc(10pt*var(--k))}
  #orwrap .sig .inner input{flex:1}
  #orwrap .sig .cap{width:100%;padding-left:calc(0.95in*var(--k));font-size:calc(9pt*var(--k));margin-top:1pt}
  }
  #ormeasure{--k:1;--t:1;--lh:1.35;--cols:1;--mh:1}
  #ormeasure .sheet{width:7.0in;max-width:none;margin:0 auto;padding:0;box-shadow:none;border-radius:0;background:#fff;font-size:calc(10.5pt*var(--k))}
  #ormeasure .hdr{margin-bottom:calc(10pt*var(--k))}
  #ormeasure .hdr .h1{font-size:calc(11.5pt*var(--k))}
  #ormeasure .hdr .h2{font-size:calc(9.5pt*var(--k))}
  #ormeasure .hdr .h3{font-size:calc(9.5pt*var(--k));margin-top:calc(8pt*var(--k))}
  #ormeasure .row{flex-wrap:nowrap;gap:0 calc(12pt*var(--k));margin:0 0 calc(3pt*var(--k))}
  #ormeasure .f{flex-direction:row;align-items:flex-end;flex:1 1 auto}
  #ormeasure label, #ormeasure .lbl{font-size:calc(10pt*var(--k));font-weight:normal;margin:0 calc(6pt*var(--k)) 0 0;white-space:nowrap}
  #ormeasure input[type=text]{flex:1;min-width:0;min-height:0;height:calc(15pt*var(--k));padding:0 2pt;font-size:calc(10.5pt*var(--k));border:0;border-bottom:1px solid #000;border-radius:0;background:transparent;outline:0}
  #ormeasure input::placeholder{color:transparent}
  #ormeasure textarea{display:none}
  #ormeasure .mirror{display:block;white-space:pre-wrap;overflow-wrap:anywhere;word-wrap:break-word;font-size:calc(10.5pt*var(--k)*var(--t));line-height:var(--lh);padding:calc(3pt*var(--k)) 0 0 0}
  #ormeasure .mirror.long{column-count:var(--cols);column-gap:calc(14pt*var(--k));column-rule:1px solid #bbb}
  #ormeasure .blk{margin:0 0 calc(6pt*var(--k))}
  #ormeasure .r2{margin-bottom:calc(10pt*var(--k))!important}
  #ormeasure .blk .lbl{display:block;margin:0}
  #ormeasure .m_pre, #ormeasure .m_post{min-height:calc(1.25in*var(--k)*var(--mh))}
  #ormeasure .m_title{min-height:calc(0.75in*var(--k)*var(--mh))}
  #ormeasure .m_find{min-height:calc(2.1in*var(--k)*var(--mh))}
  #ormeasure .r1 .name{flex:4.2} #ormeasure .r1 .age{flex:1.3} #ormeasure .r1 .sex{flex:1.4} #ormeasure .r1 .cs{flex:1.3}
  #ormeasure .r2 .ward{flex:2.4} #ormeasure .r2 .bed{flex:2.2} #ormeasure .r2 .hosp{flex:2.4}
  #ormeasure .grid2{display:flex;gap:0 calc(22pt*var(--k))}
  #ormeasure .grid2 .col{flex:1;display:flex;flex-direction:column;min-width:0}
  #ormeasure .grid2 .row{margin:0 0 calc(7pt*var(--k))}
  #ormeasure .grid2 label{min-width:0}
  #ormeasure .spacer{display:block;height:calc(15pt*var(--k));margin:0 0 calc(7pt*var(--k))}
  #ormeasure .titlerow{display:flex;align-items:flex-end;gap:0 calc(24pt*var(--k))}
  #ormeasure .titlerow .lbl{width:auto}
  #ormeasure .titlerow .rvs{flex:0 0 calc(2.4in*var(--k))}
  #ormeasure .choice{display:none}
  #ormeasure .tick{display:inline-block;width:calc(0.9in*var(--k));border-bottom:1px solid #000;height:calc(13pt*var(--k));text-align:center;font-weight:bold;margin:0 calc(4pt*var(--k)) 0 0}
  #ormeasure .tissue{display:flex;align-items:flex-end;gap:0 calc(6pt*var(--k));margin:calc(4pt*var(--k)) 0 calc(8pt*var(--k))}
  #ormeasure .tissue .opt{white-space:nowrap;margin-right:calc(10pt*var(--k))}
  #ormeasure .tissue .spec{flex:1}
  #ormeasure .sig{margin-top:calc(10pt*var(--k))}
  #ormeasure .sig .inner{width:calc(3.3in*var(--k));max-width:none;display:flex;flex-wrap:wrap;align-items:flex-end}
  #ormeasure .sig .inner label{margin-right:calc(10pt*var(--k))}
  #ormeasure .sig .inner input{flex:1}
  #ormeasure .sig .cap{width:100%;padding-left:calc(0.95in*var(--k));font-size:calc(9pt*var(--k));margin-top:1pt}
</style>
</head>
<body>
<div class="bar">
  <button type="button" id="btnPrint">🖨 Print</button>
  <button type="button" id="btnClear">Clear form</button>
</div>
<p class="note">Fill in the fields, then tap Print. Nothing is saved: the form is blank again when you refresh or close this page.</p>

<div id="orwrap">
<form class="sheet" id="orform" autocomplete="off" onsubmit="return false">
  <div class="hdr">
    <div class="h1">BUKIDNON PROVINCIAL HOSPITAL OF MARAMAG</div>
    <div class="h2">Maramag, Bukidnon</div>
    <div class="h3">OPERATING ROOM RECORD</div>
  </div>

  <div class="row r1">
    <div class="f name"><label for="name">Name:</label><input type="text" id="name"></div>
    <div class="f s xs age"><label for="age">Age:</label><input type="text" id="age" inputmode="numeric"></div>
    <div class="f s xs sex"><label for="sex">Sex:</label><input type="text" id="sex"></div>
    <div class="f s xs cs"><label for="cs">C. S.:</label><input type="text" id="cs"></div>
  </div>
  <div class="row r2">
    <div class="f m ward"><label for="ward">Ward/Room:</label><input type="text" id="ward"></div>
    <div class="f s bed"><label for="bed">Bed Number:</label><input type="text" id="bed"></div>
    <div class="f s hosp"><label for="hosp">Hospital Number:</label><input type="text" id="hosp"></div>
  </div>

  <div class="blk">
    <label class="lbl" for="pre">PREOPERATIVE DIAGNOSIS:</label>
    <textarea id="pre" data-m="m_pre"></textarea><div class="mirror m_pre" id="m_pre"></div>
  </div>
  <div class="blk">
    <label class="lbl" for="post">POST-OPERATIVE DIAGNOSIS:</label>
    <textarea id="post" data-m="m_post"></textarea><div class="mirror m_post" id="m_post"></div>
  </div>

  <div class="grid2">
    <div class="col">
      <div class="row"><div class="f"><label for="surgeon">Surgeon:</label><input type="text" id="surgeon"></div></div>
      <div class="row"><div class="f"><label for="anes">Anesthesiologist:</label><input type="text" id="anes"></div></div>
      <div class="spacer"></div>
      <div class="row"><div class="f"><label for="opdate">Operation Date:</label><input type="text" id="opdate"></div></div>
    </div>
    <div class="col">
      <div class="row"><div class="f"><label for="assist">Assistant:</label><input type="text" id="assist"></div></div>
      <div class="row"><div class="f"><label for="tab">Time Anesthesia Began:</label><input type="text" id="tab"></div></div>
      <div class="row"><div class="f"><label for="tae">Time Anesthesia Ended:</label><input type="text" id="tae"></div></div>
      <div class="row"><div class="f"><label for="tob">Time Operation Began:</label><input type="text" id="tob"></div></div>
      <div class="row"><div class="f"><label for="toe">Time Operation Ended:</label><input type="text" id="toe"></div></div>
    </div>
  </div>

  <div class="blk">
    <div class="titlerow row">
      <label class="lbl" for="title">TITLE OF OPERATION PERFORMED:</label>
      <div class="f s rvs"><label for="rvs">RVS Code:</label><input type="text" id="rvs"></div>
    </div>
    <textarea id="title" data-m="m_title"></textarea><div class="mirror m_title" id="m_title"></div>
  </div>

  <div class="blk">
    <div class="tissue">
      <span class="lbl">Tissue to laboratory</span>
      <span class="tick" id="tk_yes"></span><span class="opt">Yes</span>
      <span class="tick" id="tk_no"></span><span class="opt">No</span>
      <div class="f spec"><label for="spec">Specimen (if any)</label><input type="text" id="spec"></div>
    </div>
    <div class="choice" role="radiogroup" aria-label="Tissue to laboratory">
      <label><input type="radio" name="tissue" value="yes"> Yes</label>
      <label><input type="radio" name="tissue" value="no"> No</label>
    </div>
  </div>

  <div class="blk">
    <label class="lbl" for="find">Description of findings intra operatively:</label>
    <textarea id="find" class="big" data-m="m_find"></textarea><div class="mirror m_find" id="m_find"></div>
  </div>

  <div class="sig">
    <div class="inner">
      <label for="sig">SURGEON:</label><input type="text" id="sig">
      <div class="cap">Signature over printed name</div>
    </div>
  </div>
</form>
</div>
<div id="ormeasure" aria-hidden="true"></div>

<script>
(function(){
  'use strict';
  var form = document.getElementById('orform');
  var tas = form.querySelectorAll('textarea');

  function grow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }
  function sync(){
    for (var i = 0; i < tas.length; i++){
      document.getElementById(tas[i].getAttribute('data-m')).textContent = tas[i].value;
    }
    var v = form.querySelector('input[name=tissue]:checked');
    document.getElementById('tk_yes').textContent = (v && v.value === 'yes') ? '\u2713' : '';
    document.getElementById('tk_no').textContent  = (v && v.value === 'no')  ? '\u2713' : '';
  }

  /* ---- one-page fitting ---------------------------------------------- */
  var meas = document.getElementById('ormeasure');
  var root = document.getElementById('orwrap');
  var MAXH = 8.95 * 96;           // target sheet height in CSS px: fits Letter even with ~0.5in phone margins + header/footer (≈9.4in usable); hard cap in print is 9.0in
  var VARS = ['--k','--t','--lh','--cols','--mh'];
  function setVars(el, c){
    el.style.setProperty('--k', c.k); el.style.setProperty('--t', c.t);
    el.style.setProperty('--lh', c.lh); el.style.setProperty('--cols', c.cols);
    el.style.setProperty('--mh', c.mh);
  }
  function markLong(scopeEl){
    var ms = scopeEl.querySelectorAll('.mirror');
    for (var i = 0; i < ms.length; i++){
      var t = ms[i].textContent, lines = t.split('\n').length;
      if (lines >= 6 || t.length > 350) ms[i].classList.add('long'); else ms[i].classList.remove('long');
    }
  }
  var clone = null;
  function buildClone(){
    meas.innerHTML = '';
    clone = form.cloneNode(true);
    clone.removeAttribute('id');
    var ids = clone.querySelectorAll('[id]');
    for (var i = 0; i < ids.length; i++){ ids[i].setAttribute('data-id', ids[i].id); }
    // drop ids so the copy never clashes with the real form
    for (var j = 0; j < ids.length; j++){
      var id = ids[j].getAttribute('data-id');
      ids[j].removeAttribute('id');
    }
    meas.appendChild(clone);
  }
  function heightFor(c){ setVars(meas, c); return clone.offsetHeight; }
  function fits(c){ return heightFor(c) <= MAXH; }
  var lastFit = null;
  function fit(){
    sync();
    // While the print layout is active the measuring copy is hidden (display:none),
    // so keep the values worked out just before (on typing / Print tap).
    if (lastFit && meas.offsetParent === null && getComputedStyle(meas).display === 'none') return lastFit;
    // copy current mirror text + ticks into the measuring copy
    if (!clone) buildClone();
    var src = form.querySelectorAll('.mirror, .tick'), dst = clone.querySelectorAll('.mirror, .tick');
    for (var i = 0; i < src.length; i++) dst[i].textContent = src[i].textContent;
    markLong(form); markLong(clone);
    // move the measuring copy into the document flow width-wise (it is absolutely positioned)
    meas.style.height = 'auto';
    var best = {k:1, t:1, lh:1.35, cols:1, mh:1};
    if (!fits(best)){
      // step 1: give up some of the empty writing space under the headings
      var c0 = {k:1, t:1, lh:1.35, cols:1, mh:0};
      if (fits(c0)){
        var lo0 = 0, hi0 = 1;
        for (var q = 0; q < 12; q++){ var m0 = (lo0 + hi0) / 2; c0.mh = m0; if (fits(c0)) lo0 = m0; else hi0 = m0; }
        c0.mh = Math.floor(lo0 * 1000) / 1000;
        best = c0;
      } else best = null;
    }
    if (!best){
      // step 2: shrink the long text (optionally in two columns)
      var cand = [1, 2];
      for (var ci = 0; ci < cand.length; ci++){
        var lo = 0.55, hi = 1, base = {k:1, lh:1.2, cols:cand[ci], mh:0};
        base.t = lo;
        if (!fits(base)) continue;
        for (var n = 0; n < 14; n++){
          var mid = (lo + hi) / 2; base.t = mid;
          if (fits(base)) lo = mid; else hi = mid;
        }
        base.t = Math.floor(lo * 1000) / 1000;
        if (!best || base.t > best.t + 0.02) best = {k:1, t:base.t, lh:1.2, cols:base.cols, mh:0};
      }
      if (!best){
        // text alone can't shrink enough: shrink the whole sheet, text at its floor
        var bc = 1, bk = 0, cols = [1, 2];
        for (var cj = 0; cj < cols.length; cj++){
          var lo2 = 0.2, hi2 = 1, c2 = {t:0.55, lh:1.15, cols:cols[cj], mh:0, k:lo2};
          if (!fits(c2)) continue;
          for (var m = 0; m < 14; m++){
            var mid2 = (lo2 + hi2) / 2; c2.k = mid2;
            if (fits(c2)) lo2 = mid2; else hi2 = mid2;
          }
          if (lo2 > bk){ bk = lo2; bc = cols[cj]; }
        }
        best = {k: Math.floor((bk || 0.2) * 1000) / 1000, t:0.55, lh:1.15, cols:bc, mh:0};
      }
    }
    if (best.t < 1 || best.k < 1){
      // use any space left over (e.g. when a little more size would make lines wrap):
      // loosen the line spacing back towards normal
      var lo3 = best.lh, hi3 = 1.45, c3 = {k:best.k, t:best.t, cols:best.cols, mh:best.mh, lh:hi3};
      if (fits(c3)) lo3 = hi3; else for (var r = 0; r < 10; r++){ var m3 = (lo3 + hi3) / 2; c3.lh = m3; if (fits(c3)) lo3 = m3; else hi3 = m3; }
      best.lh = Math.floor(lo3 * 100) / 100;
    }
    meas.style.height = '0';
    setVars(root, best);
    root.setAttribute('data-fit', JSON.stringify(best));
    lastFit = best;
    return best;
  }
  var fitTimer = null;
  function fitSoon(){ clearTimeout(fitTimer); fitTimer = setTimeout(fit, 120); }

  function clearAll(){
    form.reset();
    var ins = form.querySelectorAll('input[type=text]');
    for (var i = 0; i < ins.length; i++) ins[i].value = '';
    for (var j = 0; j < tas.length; j++){ tas[j].value = ''; tas[j].style.height = ''; }
    var rs = form.querySelectorAll('input[type=radio]');
    for (var k = 0; k < rs.length; k++) rs[k].checked = false;
    sync(); fit();
  }

  form.addEventListener('input', function(e){
    if (e.target.tagName === 'TEXTAREA') grow(e.target);
    sync(); fitSoon();
  });
  form.addEventListener('change', function(){ sync(); fit(); });
  document.getElementById('btnPrint').addEventListener('click', function(){ fit(); window.print(); });
  document.getElementById('btnClear').addEventListener('click', function(){
    if (confirm('Clear all fields?')) { clearAll(); window.scrollTo(0, 0); }
  });
  // Fit is kept up to date while typing, and re-checked right before printing
  // (beforeprint for desktop/Android Chrome, matchMedia for older Safari).
  window.addEventListener('beforeprint', fit);
  if (window.matchMedia){
    var mq = window.matchMedia('print');
    var onmq = function(e){ if (e.matches) fit(); };
    if (mq.addEventListener) mq.addEventListener('change', onmq); else if (mq.addListener) mq.addListener(onmq);
  }
  window.addEventListener('resize', fitSoon);
  window.__orFit = fit;
  // Always start blank, even if the browser tries to restore old values.
  window.addEventListener('pageshow', clearAll);
  clearAll();
})();
</script>
